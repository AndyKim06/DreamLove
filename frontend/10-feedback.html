<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Dream Love - Ending</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/feedback-style.css" />
</head>
<body>
    <main class="ending-container">
        <div class="envelope-wrapper">
            <h2 id="ending-title" class="ending-title"></h2>

              <div class="letter-content">
                  <div id="success-content" class="content-box hidden">
                      <img id="couple-photo" src="" alt="커플 셀카" class="couple-photo" />
                      <div class="result-btn-group">
                          <button id="restart-btn" class="restart-btn" onclick="restartGame()">Restart</button>
                      </div>
                  </div>
                  
                  <div id="fail-content" class="content-box hidden">
                      <p id="feedback-text" class="feedback-text"></p>
                      <div class="result-btn-group">
                          <button id="detail-btn" class="detail-btn" onclick="showDetailFeedback()">상세 피드백 보기</button>
                      </div>
                  </div>
              </div>

              <!-- 상세 피드백 모달 -->
              <div id="detail-modal" class="detail-modal hidden">
                  <div class="detail-modal-content">
                      <div class="detail-header">
                          <h3>상세 피드백</h3>
                          <span class="detail-close" onclick="closeDetailModal()">×</span>
                      </div>
                      <div id="detail-feedback-content" class="detail-body"></div>
                  </div>
              </div>

    </main>

    <div id="qr-modal" class="modal hidden">
        <div class="modal-overlay" onclick="closeQRModal()"></div>
        <div class="modal-window">
            <div class="window-header">
                <span class="window-title">QR Code</span>
                <span class="btn-close" onclick="closeQRModal()">X</span>
            </div>
            <div class="window-body">
                <img id="qr-code-img" src="" alt="QR Code" />
                <button class="pixel-btn" onclick="closeQRModal()">CLOSE</button>
            </div>
        </div>
    </div>

    <script src="js/feedback.js"></script>
</body>
</html>
