<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Love - Chat</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/chat-screen.css">
</head>
<body>
    <div class="bg-image"></div>

    <main class="design-container">
        <div class="game-wrapper">
            
            <div class="ui-box dialogue-box">
                <div class="dialogue-content">
                    <span id="char-name" class="char-label"></span>
                    <p id="char-msg"></p>
                </div>
            </div>

            <div class="ui-box station-box">
                <span id="station-text" class="station-text">Game start</span>
            </div>

            <div class="heart-area">
                <img src="assets/images/heart.svg" class="heart-icon active">
                <img src="assets/images/heart.svg" class="heart-icon active">
                <img src="assets/images/heart.svg" class="heart-icon active">
                <img src="assets/images/heart.svg" class="heart-icon">
            </div>

            <div class="ui-box main-visual-box">
                <div id="intro-layer" class="mission-container">
                    <div class="mission-header">. . . MISSION . . .</div>
                    <div class="mission-body">
                        <p id="intro-text">로딩중...</p>
                    </div>
                </div>
                <img id="main-photo" src="" alt="Partner Face" class="hidden">
                <div id="loading-overlay" class="loading-overlay hidden">
                    <div class="pixel-spinner"></div>
                    <p>이상형 생성중...</p>
                </div>
            </div>

            <div class="ui-box bottom-bar-box">
                <button id="start-btn" class="start-btn hidden" onclick="startGame()">
                    데이트 시작하기
                </button>
                <div id="user-input-mode" class="chat-content hidden">
                    <input type="text" id="user-input" placeholder="답변을 입력하세요..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <button onclick="sendMessage()" class="send-btn">전송</button>
                </div>
            </div>

        </div>
    </main>
    <script src="js/chat-screen.js"></script>
</body>
</html>
