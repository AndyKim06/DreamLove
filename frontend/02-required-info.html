<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Love - Required Info</title>

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/required.css">
</head>

<body>

    <header class="main-header">
        <h1 class="header-title">Write your information...</h1>
        <div class="heart-container">
            <img src="assets/images/heart.svg" alt="heart" class="pixel-heart">
            <img src="assets/images/heart.svg" alt="heart" class="pixel-heart">
            <img src="assets/images/heart.svg" alt="heart" class="pixel-heart">
            <img src="assets/images/heart.svg" alt="heart" class="pixel-heart">
        </div>
    </header>

    <main class="design-container">

        <img src="assets/images/back_arrow.svg" class="arrow-btn arrow-back" onclick="goBack()" alt="Back">

        <div class="input-container">
            <img src="assets/images/required_input.png" class="input-bg-img" alt="Input Frame">

            <div class="box-title">연애 고민 입력</div>

            <textarea id="user-worry" class="transparent-textarea"
                placeholder="ex. 짝사랑 중인데 영화관에 가서 너무 떨려 도와주라"></textarea>
        </div>

        <p class="info-text">
            상대방과의 관계, 데이트 장소를 포함하여 원하는 데이트를 입력하세요
        </p>

        <img src="assets/images/next_btn.png" class="next-btn-img" onclick="goNext()" alt="Next Button">


    </main>

    <script src="js/required.js"></script>
</body>

</html>
