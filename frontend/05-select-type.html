<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Love - DIY Ideal Type</title>

    <link rel="stylesheet" href="/static/css/reset.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/select-type.css">
</head>
<body>

<header class="main-header">
    <h1 class="header-title">내가 좋아하는 외적 이상형은? ...</h1>
    <div class="heart-container">
        <img src="assets/images/heart.svg" alt="heart" class="pixel-heart">
        <img src="assets/images/heart.svg" alt="heart" class="pixel-heart">
        <img src="assets/images/heart.svg" alt="heart" class="pixel-heart">
        <img src="assets/images/heart.svg" alt="heart" class="pixel-heart">
    </div>
</header>

<main class="design-container">

    <img src="assets/images/back_arrow.svg"
         class="arrow-btn arrow-back"
         onclick="goBack()"
         alt="Back">

    <!-- Preview Area -->
    <div class="preview-area">
        <div class="pixel-window preview-win" id="win-1">
            <div class="window-header">
                <span class="win-title">Type 1</span>
                <span class="win-x">X</span>
            </div>
            <div class="window-body"></div>
        </div>

        <div class="pixel-window preview-win" id="win-2">
            <div class="window-header">
                <span class="win-title">Type 2</span>
                <span class="win-x">X</span>
            </div>
            <div class="window-body"></div>
        </div>

        <div class="pixel-window preview-win" id="win-3">
            <div class="window-header">
                <span class="win-title">Type 3</span>
                <span class="win-x">X</span>
            </div>
            <div class="window-body"></div>
        </div>

        <div class="pixel-window preview-win" id="win-4">
            <div class="window-header">
                <span class="win-title">Type 4</span>
                <span class="win-x">X</span>
            </div>
            <div class="window-body"></div>
        </div>
    </div>

    <!-- DIY Panel -->
    <div class="diy-panel">

        <div class="diy-header">
            <span class="diy-title">♥ D.I.Y ♥</span>
            <button class="diy-close-btn">X</button>
        </div>

        <div class="diy-body">

            <!-- Eyelid -->
            <div class="form-group row-group">
                <label class="radio-label">
                    <input type="radio" name="eyelid" value="monolid" checked>
                    <span class="radio-custom"></span> 무쌍
                </label>
                <label class="radio-label">
                    <input type="radio" name="eyelid" value="double">
                    <span class="radio-custom"></span> 유쌍
                </label>
            </div>

            <!-- Face Shape -->
            <div class="form-group">
                <label class="input-label">얼굴형</label>
                <div class="select-wrapper">
                    <select id="face-shape" class="pixel-select">
                        <option value="v-line">V라인</option>
                        <option value="round">둥근형</option>
                    </select>
                    <span class="select-arrow">▼</span>
                </div>
            </div>

            <!-- Makeup -->
            <div class="form-group">
                <label class="input-label">메이크업 강도</label>
                <div class="select-wrapper">
                    <select id="makeup-style" class="pixel-select">
                        <option value="light">가볍게</option>
                        <option value="heavy">진하게</option>
                    </select>
                    <span class="select-arrow">▼</span>
                </div>
            </div>

            <!-- Hair -->
            <div class="form-group">
                <label class="input-label">헤어스타일</label>
                <div class="select-wrapper">
                    <select id="hair-style" class="pixel-select">
                        <option value="long">긴머리</option>
                        <option value="short-bob">단발머리</option>
                        <option value="short">숏컷</option>
                    </select>
                    <span class="select-arrow">▼</span>
                </div>
            </div>

            <!-- Clothes -->
            <div class="form-group">
                <label class="input-label">옷 스타일</label>
                <div class="select-wrapper">
                    <select id="clothe-style" class="pixel-select">
                        <option value="shirt">셔츠</option>
                        <option value="knit">니트</option>
                        <option value="hoodie">후드티</option>
                    </select>
                    <span class="select-arrow">▼</span>
                </div>
            </div>

            <!-- Skin Tone -->
            <div class="form-group last-group">
                <label class="input-label">피부톤</label>
                <div class="skin-control-wrapper">
                    <input type="range"
                           id="skin-slider"
                           min="0"
                           max="100"
                           value="50"
                           class="pixel-slider"
                           oninput="updateSkinColor(this.value)">
                    <div id="skin-preview-box" class="skin-color-display"></div>
                </div>
            </div>

        </div>

        <div class="diy-footer">
            <button class="generate-btn" onclick="generateIdeal()">생 성 하 기</button>
        </div>

    </div>

    <img src="assets/images/next_arrow.svg"
         class="arrow-btn arrow-next"
         onclick="goNext()"
         alt="Next">

</main>

<script src="js/select-type.js"></script>
</body>
</html>
